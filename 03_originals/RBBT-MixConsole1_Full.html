<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>RABBIT Studio Console — Class-A Magic Mix</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  :root{
    --wood-dark:#131415;
    --wood-mid:#232527;
    --wood-light:#4a4d52;
    --metal-dark:#1a1c1e;
    --metal-mid:#34373b;
    --metal-light:#7a7f87;
    --panel:#212326;
    --cream:#f0f0ee;
    --cream-dim:#b9bec5;
    --neve-red:#8f1a28;
    --neve-red-bright:#d92e3a;
    --amber:#e0ab52;
    --green:#6da06d;
    --screw:#1a1c1e;
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(217,46,58,.10), transparent 60%),
      repeating-linear-gradient(180deg, #1c1d1f 0 2px, #101112 2px 4px);
    font-family:'Barlow','Helvetica Neue','Arial',sans-serif;
    color:var(--cream);
    overflow-x:auto;
  }
  .console-wrap{
    display:flex;
    min-width:max-content;
    background:linear-gradient(180deg,var(--wood-light),var(--wood-dark) 8%, var(--wood-dark) 92%, var(--wood-light));
    padding:18px;
  }
  .cheek{
    width:26px;
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.15) 0 2px, transparent 2px 8px),
      linear-gradient(180deg,var(--wood-light),var(--wood-mid) 40%, var(--wood-dark));
    border-radius:4px;
    box-shadow: inset 0 0 12px rgba(0,0,0,.6);
    margin:0 4px;
  }
  .console{
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,.05), transparent 40%),
      linear-gradient(180deg, var(--metal-dark), var(--wood-dark) 6%, var(--wood-dark) 94%, var(--metal-dark));
    border-radius:6px;
    padding:14px 16px 20px 16px;
    box-shadow: inset 0 2px 4px rgba(255,255,255,.08), inset 0 -3px 10px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.6);
  }
  .brand-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 10px 14px 10px;
    border-bottom:1px solid var(--metal-light);
    margin-bottom:14px;
    position:relative;
  }
  .hazard{
    position:absolute; top:-14px; left:-16px; right:-16px; height:3px;
    background:linear-gradient(90deg, transparent, var(--neve-red-bright) 15%, var(--neve-red-bright) 85%, transparent);
    opacity:.65;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ height:40px; width:auto; filter:drop-shadow(0 0 6px rgba(194,31,43,.4)); opacity:.92; }
  .brand-text{ display:flex; flex-direction:column; gap:2px; }
  .brand-title{
    font-family:'Michroma','Arial Narrow',sans-serif;
    font-weight:400; font-size:22px; letter-spacing:.02em;
    color:var(--cream);
    text-shadow:2px 0 0 var(--neve-red-bright), 0 0 24px rgba(194,31,43,.4);
  }
  .brand span{color:var(--neve-red-bright);}
  .brand-sub{font-size:10px; letter-spacing:.16em; color:var(--cream-dim); text-transform:uppercase; margin-top:2px;}
  .plate{
    background:var(--metal-dark);
    border:1px solid var(--metal-light);
    border-radius:3px;
    padding:6px 14px;
    font-family:'Barlow',sans-serif;
    font-size:10px; letter-spacing:2px; color:var(--amber);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.8);
  }
  .strips{ display:flex; gap:6px; align-items:flex-start;}

  /* ===== channel strip ===== */
  .strip{
    width:136px;
    background:linear-gradient(180deg,var(--metal-light),var(--metal-mid) 10%, var(--metal-mid) 90%, var(--metal-dark));
    border:1px solid var(--metal-light);
    border-radius:4px;
    padding:8px 7px 10px 7px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .strip-num{
    font-family:'Michroma','Arial Narrow',sans-serif;
    font-size:10px; color:#000; font-weight:600; letter-spacing:1px;
  }
  .label-plate{
    width:100%;
    background:var(--metal-dark);
    border:1px solid #000;
    border-radius:2px;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.9);
    padding:4px;
  }
  .track-name{
    width:100%; background:transparent; border:none; color:var(--cream);
    font-family:'Michroma','Arial Narrow',sans-serif; font-size:10px; text-align:center; letter-spacing:.02em;
    outline:none;
  }
  .load-row{ display:flex; gap:4px; width:100%; }
  .load-btn{
    flex:1; font-family:'Michroma','Arial Narrow',sans-serif; font-size:10px; letter-spacing:.5px; padding:5px 2px;
    background:linear-gradient(180deg,var(--metal-mid),var(--metal-dark));
    color:var(--cream); border:1px solid var(--wood-dark); border-radius:3px;
    cursor:pointer; box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .load-btn:active{ box-shadow:0 0 0 #000; transform:translateY(2px); }
  .clear-btn{
    width:20px; flex-shrink:0; font-family:'Michroma','Arial Narrow',sans-serif; font-size:10px; padding:5px 2px;
    background:linear-gradient(180deg,var(--metal-mid),var(--metal-dark));
    color:var(--cream-dim); border:1px solid var(--wood-dark); border-radius:3px;
    cursor:pointer; box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .clear-btn:hover{ color:var(--neve-red-bright); border-color:var(--neve-red-bright); }
  .clear-btn:active{ box-shadow:0 0 0 #000; transform:translateY(2px); }
  .file-name{
    font-size:10px; color:var(--cream-dim); text-align:center; height:12px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; width:100%;
  }
  .meter-canvas{ width:14px; height:160px; background:#0c0c0c; border:1px solid #000; border-radius:2px; }

  .knob-row{ display:flex; gap:8px; align-items:flex-end; }
  .knob-block{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .knob{
    width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a3a3a, #0d0d0d 80%);
    border:2px solid #000;
    box-shadow:0 2px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px var(--metal-light);
    position:relative; cursor:ns-resize;
  }
  .knob-label{ font-size:10px; letter-spacing:1px; color:var(--cream-dim); text-transform:uppercase; }
  .knob-val{ font-size:10px; color:var(--cream); }

  .eq-block{
    width:100%;
    background:linear-gradient(180deg,var(--metal-mid),var(--metal-dark));
    border:1px solid var(--metal-light); border-radius:3px;
    padding:6px 5px; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .eq-title{ font-family:'Michroma','Arial Narrow',sans-serif; font-size:10px; letter-spacing:1.5px; color:var(--cream-dim); }
  .locut-btn{
    width:100%; font-family:'Michroma','Arial Narrow',sans-serif; font-size:10px; letter-spacing:.5px; padding:4px 2px;
    background:linear-gradient(180deg,var(--wood-light),var(--metal-mid));
    color:var(--cream-dim); border:1px solid var(--metal-dark); border-radius:3px;
    cursor:pointer; box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .locut-btn.active{
    background:linear-gradient(180deg,var(--neve-red-bright),var(--neve-red)); color:#fff;
    box-shadow:0 0 6px rgba(194,31,43,.7), 0 2px 0 #000;
  }
  .locut-btn:active{ transform:translateY(2px); box-shadow:none; }
  .eq-knobs{ display:flex; justify-content:space-between; width:100%; gap:2px; }
  .knob.knob-sm{ width:26px; height:26px; }
  .knob.knob-sm > div{ height:9px !important; transform-origin:50% 11px !important; top:2px !important; }
  .mid-freq-select{
    width:100%; font-size:10px; letter-spacing:.5px; text-align:center;
    background:var(--metal-dark); color:var(--amber); border:1px solid #000; border-radius:2px;
    padding:2px 0; margin-top:2px;
  }

  .fader-area{ display:flex; gap:8px; align-items:flex-end; height:205px; }
  .fader-col{ display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end;}
  .fader-track{ position:relative; width:34px; height:160px; background:linear-gradient(90deg,#0a0a0a,#1c1c1c,#0a0a0a); border-radius:3px; border:1px solid #000; box-shadow:inset 0 0 6px rgba(0,0,0,.8);}
  .fader-slot{ position:absolute; left:50%; top:6px; bottom:6px; width:2px; background:#000; transform:translateX(-50%); }
  input[type=range].vfader{
    -webkit-appearance:none; appearance:none;
    width:160px; height:30px;
    background:transparent;
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-90deg);
    margin:0;
  }
  input[type=range].vfader::-webkit-slider-runnable-track{ background:transparent; height:4px;}
  input[type=range].vfader::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:44px; height:16px;
    background:
      linear-gradient(90deg, rgba(0,0,0,0) calc(50% - 1.2px), rgba(20,16,8,.95) calc(50% - 1.2px), rgba(20,16,8,.95) calc(50% + 1.2px), rgba(0,0,0,0) calc(50% + 1.2px)),
      linear-gradient(180deg,#e6dcc0,#b9ac86 45%, #8c7f5c);
    border:1px solid #16140e; border-radius:2px;
    box-shadow:0 1px 2px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.4);
    margin-top:-6px;
    cursor:ns-resize;
  }
  input[type=range].vfader::-moz-range-track{ background:transparent; height:4px;}
  input[type=range].vfader::-moz-range-thumb{
    width:44px; height:16px;
    background:
      linear-gradient(90deg, rgba(0,0,0,0) calc(50% - 1.2px), rgba(20,16,8,.95) calc(50% - 1.2px), rgba(20,16,8,.95) calc(50% + 1.2px), rgba(0,0,0,0) calc(50% + 1.2px)),
      linear-gradient(180deg,#e6dcc0,#b9ac86 45%, #8c7f5c);
    border:1px solid #16140e; border-radius:2px;
    cursor:ns-resize;
  }
  .fader-label{ font-size:10px; letter-spacing:1px; color:var(--cream-dim); width:40px; text-align:center; white-space:nowrap; }
  #masterDbReadout{ width:70px; }
  .fader-track-wrap{ display:flex; align-items:flex-start; gap:3px; }
  .fader-scale{ position:relative; width:16px; height:160px; }
  .fader-scale-mark{
    position:absolute; left:0; transform:translateY(-50%);
    font-size:10px; line-height:1; color:var(--cream-dim); white-space:nowrap;
  }

  .btn-row{ display:flex; gap:6px; }
  .mssbtn{
    width:26px; height:20px; border-radius:3px; border:1px solid #000; font-family:'Michroma','Arial Narrow',sans-serif; font-size:10px; font-weight:400;
    background:linear-gradient(180deg,var(--metal-mid),var(--metal-dark));
    color:var(--cream-dim); cursor:pointer; box-shadow:0 2px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .mssbtn.mute.active{ background:linear-gradient(180deg,var(--neve-red-bright),var(--neve-red)); color:#fff; box-shadow:0 0 8px rgba(194,31,43,.8), 0 2px 0 #000;}
  .mssbtn.solo.active{ background:linear-gradient(180deg,#f0c15a,var(--amber)); color:#231a06; box-shadow:0 0 8px rgba(217,164,65,.8), 0 2px 0 #000;}
  .mssbtn:active{ transform:translateY(2px); box-shadow:none;}

  /* ===== master / reverb module ===== */
  /* ===== add track button ===== */
  .add-track-strip{
    width:136px; min-height:470px;
    background:repeating-linear-gradient(135deg, #6b7078, #6b7078 8px, #565b62 8px, #565b62 16px);
    border:2px dashed var(--metal-light); border-radius:4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .add-track-strip:hover{ border-color:var(--neve-red-bright); background:repeating-linear-gradient(135deg, #7a7f87, #7a7f87 8px, #565b62 8px, #565b62 16px); }
  .add-track-plus{
    width:40px; height:40px; border-radius:50%;
    border:2px solid #000;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; color:#000; line-height:1; font-weight:700;
  }
  .add-track-strip:hover .add-track-plus{ border-color:var(--neve-red-bright); color:var(--neve-red-bright); }
  .add-track-label{ font-family:'Michroma','Arial Narrow',sans-serif; font-size:10px; letter-spacing:1.5px; color:#000; font-weight:600; }
  .add-track-strip:hover .add-track-label{ color:var(--neve-red-bright); }

  .master-module{
    width:300px;
    background:linear-gradient(180deg,var(--metal-light),var(--metal-mid) 10%, var(--metal-mid) 90%, var(--metal-dark));
    border:1px solid var(--metal-light); border-radius:4px;
    padding:10px 12px 14px 12px;
    display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .module-title{ font-family:'Michroma','Arial Narrow',sans-serif; font-size:12px; letter-spacing:.08em; color:var(--cream); text-shadow:1px 0 0 var(--neve-red-bright); font-weight:400; border-bottom:1px solid var(--metal-light); width:100%; text-align:center; padding-bottom:6px;}
  .reverb-knobs{ display:flex; justify-content:space-between; width:100%; }
  .master-faders{ display:flex; gap:20px; align-items:flex-end; }
  .master-meter-pair{ display:flex; gap:3px; height:160px; }
  .master-meter-canvas{ width:12px; height:160px; background:#0c0c0c; border:1px solid #000; border-radius:2px; }
  .transport{ display:flex; gap:8px; width:100%; }
  .tbtn{
    flex:1; padding:8px 4px; font-family:'Michroma','Arial Narrow',sans-serif; font-size:10px; letter-spacing:.02em; font-weight:400;
    background:linear-gradient(180deg,var(--metal-mid),var(--metal-dark)); color:var(--cream); border:1px solid var(--wood-dark);
    border-radius:4px; cursor:pointer; box-shadow:0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .tbtn:active{ transform:translateY(3px); box-shadow:none;}
  .tbtn.play.playing{ background:linear-gradient(180deg,var(--green),#365936); }
  .tbtn.render{ background:linear-gradient(180deg,#ff6a45,var(--neve-red-bright)); border-color:#c72c14; }
  .status-line{ font-size:10px; color:var(--amber); letter-spacing:1px; text-align:center; min-height:12px; width:100%;}
  .screw{ width:6px; height:6px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#cfd2d6,#5a5e64 65%,#1a1c1e); position:absolute; box-shadow:0 1px 1px rgba(0,0,0,.6); }
  .strip, .master-module{ position:relative; }
  .strip .screw:nth-child(1), .master-module .screw:nth-child(1){ top:3px; left:3px; }

  /* ===== timeline module ===== */
  .timeline-module{
    width:100%;
    margin-top:14px;
    background:linear-gradient(180deg,var(--metal-light),var(--metal-mid) 10%, var(--metal-dark));
    border:1px solid var(--metal-light); border-radius:4px;
    padding:10px 14px 12px 14px;
  }
  .timeline-title{ font-family:'Michroma','Arial Narrow',sans-serif; font-weight:400; font-size:12px; letter-spacing:.08em; color:var(--cream); text-shadow:1px 0 0 var(--neve-red-bright), 0 0 16px rgba(194,31,43,.4); }
  .timeline-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .time-display{ font-size:12px; letter-spacing:1px; color:var(--amber); font-variant-numeric:tabular-nums; }
  .timeline-track{
    position:relative; width:100%; height:34px;
    background:linear-gradient(180deg,var(--metal-dark),#000);
    border:1px solid #000; border-radius:3px;
    box-shadow:inset 0 0 6px rgba(0,0,0,.8);
    cursor:pointer;
  }
  .timeline-track.loop-active{ box-shadow:inset 0 0 6px rgba(0,0,0,.8), 0 0 6px rgba(217,164,65,.5); }
  .loop-region{
    position:absolute; top:0; bottom:0; left:0; width:0;
    background:rgba(217,164,65,.22);
    border-left:1px solid rgba(217,164,65,.7); border-right:1px solid rgba(217,164,65,.7);
    pointer-events:none;
  }
  .playhead{
    position:absolute; top:0; bottom:0; left:0; width:2px;
    background:var(--neve-red-bright); box-shadow:0 0 4px rgba(194,31,43,.8);
    pointer-events:none;
  }
  .loop-handle{
    position:absolute; top:-2px; width:14px; height:38px; margin-left:-7px;
    background:linear-gradient(180deg,var(--neve-red-bright),var(--neve-red));
    border:1px solid #000; border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#fff; cursor:ew-resize; z-index:2;
    box-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .timeline-hint{ font-size:10px; letter-spacing:.3px; color:var(--cream-dim); margin-top:6px; text-align:center;}
</style>
</head>

<script>
/* ============================================================
   AUDIO ENGINE
   ============================================================ */
const NUM_TRACKS = 6;
const MAX_TRACKS = 32;
const FADER_MAX_GAIN = Math.pow(10, 6/20); // +6dB of headroom above unity (0dB)
const FADER_ZERO_POS = 0.75;  // fraction of travel (from bottom) where 0dB sits
const FADER_TOP_DB = 6;       // dB value at the very top of the fader
const FADER_BOTTOM_DB = -60;  // dB value used as the practical floor just above true silence

function posToGain(p){
  p = Math.min(1, Math.max(0, p));
  if(p <= 0.001) return 0; // true silence at the very bottom
  if(p >= FADER_ZERO_POS){
    const db = (p-FADER_ZERO_POS)/(1-FADER_ZERO_POS) * FADER_TOP_DB;
    return Math.pow(10, db/20);
  } else {
    const db = (p/FADER_ZERO_POS - 1) * Math.abs(FADER_BOTTOM_DB);
    return Math.pow(10, db/20);
  }
}
function gainToPos(g){
  if(g<=0.00001) return 0;
  const db = 20*Math.log10(g);
  if(db>=0){
    return FADER_ZERO_POS + Math.min(db,FADER_TOP_DB)/FADER_TOP_DB * (1-FADER_ZERO_POS);
  } else {
    const clamped = Math.max(FADER_BOTTOM_DB, db);
    return (clamped/Math.abs(FADER_BOTTOM_DB) + 1) * FADER_ZERO_POS;
  }
}

// The native slider thumb's centre — not the track's raw 0-100% — is what actually
// represents the value: browsers keep the thumb's centre inset by half its own size
// from each end of the track. FADER_TRACK_H/FADER_THUMB_H must match the CSS below
// (.fader-track height, and the vfader thumb's travel-axis size) so that anything we
// draw next to the fader lines up with where the thumb really sits for a given value.
const FADER_TRACK_H = 160;
const FADER_THUMB_H = 44;
function faderPosToTopPercent(p){
  const inset = FADER_THUMB_H/2;
  const centerFromTop = (1-p) * (FADER_TRACK_H - FADER_THUMB_H) + inset;
  return (centerFromTop / FADER_TRACK_H) * 100;
}
const ctx = new (window.AudioContext || window.webkitAudioContext)();

const masterInput = ctx.createGain();      // sums dry track signals + wet reverb return
const masterFader  = ctx.createGain();
masterFader.gain.value = 1.0;
masterInput.connect(masterFader);
masterFader.connect(ctx.destination);

// ---- stereo master meter (post master fader) ----
const masterSplitter = ctx.createChannelSplitter(2);
const masterAnalyserL = ctx.createAnalyser(); masterAnalyserL.fftSize = 512;
const masterAnalyserR = ctx.createAnalyser(); masterAnalyserR.fftSize = 512;
masterFader.connect(masterSplitter);
masterSplitter.connect(masterAnalyserL, 0);
masterSplitter.connect(masterAnalyserR, 1);
const masterMeterDataL = new Float32Array(masterAnalyserL.fftSize);
const masterMeterDataR = new Float32Array(masterAnalyserR.fftSize);
function peakDb(analyser, data){
  analyser.getFloatTimeDomainData(data);
  let peak = 0;
  for(let i=0;i<data.length;i++){
    const v = Math.abs(data[i]);
    if(v>peak) peak=v;
  }
  if(peak<=0.00001) return -60; // true (near-)silence floor
  return Math.max(-60, 20*Math.log10(peak));
}
const METER_H = 160; // same height as the faders
function dbToFrac(db){ return Math.min(1, Math.max(0, (db+60)/(6+60))); } // -60dB..+6dB range, shared by every meter
function drawMeterBar(canvas, db){
  const g = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  g.clearRect(0,0,w,h);
  const frac = dbToFrac(db);
  const barH = frac*h;
  const grad = g.createLinearGradient(0,h,0,0);
  grad.addColorStop(0,'#5c8f5c'); grad.addColorStop(0.78,'#d9a441'); grad.addColorStop(0.92,'#e2372f'); grad.addColorStop(1,'#e2372f');
  g.fillStyle = grad;
  g.fillRect(0, h-barH, w, barH);
  // 0dB reference line
  const zeroY = h - dbToFrac(0)*h;
  g.strokeStyle = 'rgba(255,255,255,.35)';
  g.beginPath(); g.moveTo(0,zeroY); g.lineTo(w,zeroY); g.stroke();
}

// ---- reverb bus ----
const reverbInputBus = ctx.createGain();   // sum of all track sends
reverbInputBus.gain.value = 1;
const convolver = ctx.createConvolver();
const hicutFilter = ctx.createBiquadFilter(); hicutFilter.type = 'lowpass';
const locutFilter = ctx.createBiquadFilter(); locutFilter.type = 'highpass';
const reverbReturn = ctx.createGain(); reverbReturn.gain.value = 1.0;

reverbInputBus.connect(convolver);
convolver.connect(locutFilter);
locutFilter.connect(hicutFilter);
hicutFilter.connect(reverbReturn);
reverbReturn.connect(masterInput);

const reverbParams = { decay:2.2, size:0.5, hicut:9000, locut:150 };

function generateImpulse(decay, size){
  const sampleRate = ctx.sampleRate;
  const length = Math.max(1, Math.floor(sampleRate * decay));
  const predelaySamples = Math.floor(size * 0.045 * sampleRate);
  const impulse = ctx.createBuffer(2, length + predelaySamples, sampleRate);
  const power = 1.2 + (1 - size) * 2.2; // bigger "size" -> slower/denser falling curve
  for(let ch=0; ch<2; ch++){
    const data = impulse.getChannelData(ch);
    for(let i=0;i<predelaySamples;i++) data[i]=0;
    for(let i=0;i<length;i++){
      const t = i/length;
      const env = Math.pow(1-t, power);
      data[i+predelaySamples] = (Math.random()*2-1) * env;
    }
  }
  return impulse;
}
function rebuildImpulse(){
  convolver.buffer = generateImpulse(reverbParams.decay, reverbParams.size);
}
rebuildImpulse();
function applyReverbFilters(){
  hicutFilter.frequency.setTargetAtTime(reverbParams.hicut, ctx.currentTime, 0.02);
  locutFilter.frequency.setTargetAtTime(reverbParams.locut, ctx.currentTime, 0.02);
}
applyReverbFilters();

// ---- tracks ----
const LOCUT_FREQ = 75;
const LOW_SHELF_FREQ = 120;
const HIGH_SHELF_FREQ = 8000;
const MID_FREQ_DEFAULT = 1000;

const tracks = [];

function createTrackNode(index){
  const lowCutFilter = ctx.createBiquadFilter(); lowCutFilter.type='highpass'; lowCutFilter.frequency.value = 20; // off by default
  const lowShelf = ctx.createBiquadFilter(); lowShelf.type='lowshelf'; lowShelf.frequency.value = LOW_SHELF_FREQ; lowShelf.gain.value = 0;
  const midFilter = ctx.createBiquadFilter(); midFilter.type='peaking'; midFilter.frequency.value = MID_FREQ_DEFAULT; midFilter.Q.value = 1; midFilter.gain.value = 0;
  const highShelf = ctx.createBiquadFilter(); highShelf.type='highshelf'; highShelf.frequency.value = HIGH_SHELF_FREQ; highShelf.gain.value = 0;
  const trackGain = ctx.createGain(); trackGain.gain.value = 0.8;
  const trackPan  = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const muteGain  = ctx.createGain(); muteGain.gain.value = 1;
  const sendGain  = ctx.createGain(); sendGain.gain.value = 0;
  const analyser  = ctx.createAnalyser(); analyser.fftSize = 256;

  lowCutFilter.connect(lowShelf);
  lowShelf.connect(midFilter);
  midFilter.connect(highShelf);
  highShelf.connect(trackGain);
  trackGain.connect(trackPan || muteGain);
  if(trackPan){ trackPan.connect(muteGain); }
  muteGain.connect(analyser);
  analyser.connect(masterInput);
  // send taps post-fader/pan/EQ, post mute so muted tracks don't feed reverb
  muteGain.connect(sendGain);
  sendGain.connect(reverbInputBus);

  return {
    index, name:`TRACK ${index+1}`, buffer:null, fileName:'',
    lowCutFilter, lowShelf, midFilter, highShelf,
    trackGain, trackPan, muteGain, sendGain, analyser,
    volume:0.8, pan:0, send:0, muted:false, solo:false,
    lowCutOn:false, lowGain:0, midGain:0, midFreq:MID_FREQ_DEFAULT, highGain:0,
    source:null, meterData:new Float32Array(analyser.fftSize)
  };
}

for(let i=0;i<NUM_TRACKS;i++){
  tracks.push(createTrackNode(i));
}

function updateSoloMuteStates(){
  const anySolo = tracks.some(t=>t.solo);
  tracks.forEach(t=>{
    const audible = anySolo ? t.solo : !t.muted;
    t.muteGain.gain.setTargetAtTime(audible?1:0, ctx.currentTime, 0.01);
  });
}

/* ============================================================
   TRANSPORT + TIMELINE (live preview)
   ============================================================ */
let isPlaying = false;
let masterGainValue = 1.0;
let reverbReturnGainValue = 1.0;
let totalDuration = 0;      // seconds, longest loaded buffer
let seekPosition = 0;       // seconds, current playhead
let loopEnabled = false;
let loopStart = 0;
let loopEnd = 0;
let playbackAnchorCtxTime = 0;
let playbackAnchorPosition = 0;

function recomputeTotalDuration(){
  const durations = tracks.filter(t=>t.buffer).map(t=>t.buffer.duration);
  totalDuration = durations.length ? Math.max(...durations) : 0;
  if(loopEnd <= 0 || loopEnd > totalDuration) loopEnd = totalDuration;
  if(loopStart > totalDuration) loopStart = 0;
  if(seekPosition > totalDuration) seekPosition = 0;
  renderTimelineVisuals();
}

function stopAll(){
  tracks.forEach(t=>{
    if(t.source){ try{ t.source.stop(); }catch(e){} t.source.disconnect(); t.source=null; }
  });
  isPlaying = false;
  document.getElementById('playBtn').classList.remove('playing');
  document.getElementById('playBtn').textContent = '▶ PLAY';
}

function startPlaybackAt(pos){
  tracks.forEach(t=>{
    if(t.source){ try{ t.source.stop(); }catch(e){} t.source.disconnect(); t.source=null; }
  });
  if(ctx.state === 'suspended') ctx.resume();
  const loaded = tracks.filter(t=>t.buffer);
  if(loaded.length===0){ setStatus('Geen wav-bestanden geladen.'); return; }
  const startAt = ctx.currentTime + 0.06;
  playbackAnchorCtxTime = startAt;
  playbackAnchorPosition = pos;
  loaded.forEach(t=>{
    if(pos >= t.buffer.duration - 0.001) return; // nothing left in this track from here
    const src = ctx.createBufferSource();
    src.buffer = t.buffer;
    src.connect(t.lowCutFilter);
    src.onended = () => { if(t.source===src){ t.source=null; checkAllEnded(); } };
    src.start(startAt, pos);
    t.source = src;
  });
  isPlaying = true;
  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('playBtn').textContent = '■ STOP';
  setStatus('Weergave...');
}

function togglePlay(){
  if(isPlaying){ stopAll(); return; }
  const startPos = loopEnabled ? loopStart : seekPosition;
  startPlaybackAt(startPos);
}

function seekTo(pos){
  pos = Math.min(totalDuration, Math.max(0, pos));
  seekPosition = pos;
  renderTimelineVisuals();
  if(isPlaying) startPlaybackAt(pos);
}

function rewind(){ seekTo(loopEnabled ? loopStart : 0); }

function checkAllEnded(){
  if(tracks.every(t=>!t.source) && isPlaying){
    if(loopEnabled){
      startPlaybackAt(loopStart);
    } else {
      isPlaying = false;
      document.getElementById('playBtn').classList.remove('playing');
      document.getElementById('playBtn').textContent = '▶ PLAY';
      setStatus('Weergave voltooid.');
    }
  }
}

function setStatus(msg){ document.getElementById('statusLine').textContent = msg; }

function fmtTime(s){
  if(!isFinite(s) || s<0) s=0;
  const m = Math.floor(s/60);
  const sec = (s%60);
  return m.toString().padStart(2,'0') + ':' + sec.toFixed(1).padStart(4,'0');
}

let timelineEls = null; // set once the timeline DOM is built
function renderTimelineVisuals(){
  if(!timelineEls) return;
  const { track, playhead, loopRegion, handleL, handleR, timeDisplay } = timelineEls;
  const dur = totalDuration || 0.0001;
  const pf = Math.min(1, Math.max(0, seekPosition/dur));
  playhead.style.left = (pf*100)+'%';
  const lsf = Math.min(1, Math.max(0, loopStart/dur));
  const lef = Math.min(1, Math.max(0, loopEnd/dur));
  loopRegion.style.left = (lsf*100)+'%';
  loopRegion.style.width = Math.max(0,(lef-lsf)*100)+'%';
  handleL.style.left = (lsf*100)+'%';
  handleR.style.left = (lef*100)+'%';
  timeDisplay.textContent = fmtTime(seekPosition) + ' / ' + fmtTime(totalDuration);
}

function timelineTick(){
  requestAnimationFrame(timelineTick);
  if(isPlaying){
    let pos = playbackAnchorPosition + (ctx.currentTime - playbackAnchorCtxTime);
    if(loopEnabled && pos >= loopEnd - 0.005){
      startPlaybackAt(loopStart);
      return;
    }
    pos = Math.min(totalDuration, Math.max(0,pos));
    seekPosition = pos;
    renderTimelineVisuals();
  }
}

function dbLabel(g){

}
function panLabel(p){

/* Builds a tapered vertical fader: a .fader-track (with a 0dB reference line
   and a black tick at the fader's default position) plus an optional dB scale
   to its right. Returns {el, getGain, setGain} — el goes where a fader-track
   used to go, onChange(gain) fires as the fader moves. */
function createFaderControl(initialGain, onChange, opts={}){
  const showScale = opts.showScale !== false;

  const wrap = document.createElement('div'); wrap.className='fader-track-wrap';
  const faderTrack = document.createElement('div'); faderTrack.className='fader-track';
  const slot = document.createElement('div'); slot.className='fader-slot';

  const range = document.createElement('input'); range.type='range'; range.className='vfader';
  range.min=0; range.max=1; range.step=0.001;
  range.value = gainToPos(initialGain);

  range.addEventListener('input', ()=>{
    const p = parseFloat(range.value);
    const g = posToGain(p);
    onChange(g);
  });

  faderTrack.appendChild(slot);
  faderTrack.appendChild(range);
  wrap.appendChild(faderTrack);

  if(showScale){
    const scale = document.createElement('div'); scale.className='fader-scale';
    [6,0,-20,-40,-60].forEach(db=>{
      const g = db<=-60 ? 0 : Math.pow(10, db/20);
      const p = gainToPos(g);
      const mark = document.createElement('div'); mark.className='fader-scale-mark';
      mark.style.top = faderPosToTopPercent(p)+'%';
      mark.textContent = db<=-60 ? '-∞' : (db>0?'+'+db:''+db);
      scale.appendChild(mark);
    });
    wrap.appendChild(scale);
  }

  return {
    el: wrap,
    setGain:(g)=>{ range.value = gainToPos(g); }
  };
}

function makeKnob({label, min, max, value, onChange, format}){
  const block = document.createElement('div'); block.className='knob-block';
  const knob = document.createElement('div'); knob.className='knob';
  const lbl = document.createElement('div'); lbl.className='knob-label'; lbl.textContent=label;
  const val = document.createElement('div'); val.className='knob-val';

  let v = value;
  block.appendChild(knob); block.appendChild(lbl); block.appendChild(val);

  // real dot element (child, not pseudo-element) so rotation is reliable
  knob.style.setProperty('position','relative');
  const dot = document.createElement('div');
  dot.style.position='absolute'; dot.style.top='3px'; dot.style.left='50%';
  dot.style.width='2px'; dot.style.height='12px'; dot.style.background='var(--neve-red-bright)';
  dot.style.borderRadius='1px'; dot.style.transformOrigin='50% 14px';
  knob.appendChild(dot);
  knob.style.setProperty('background-clip','padding-box');
  // hide the CSS ::after dot by overriding content none via class
  knob.classList.add('has-dot');

  function draw(){
    const t = (v-min)/(max-min);
    const deg = -135 + t*270;
    dot.style.transform = `translateX(-50%) rotate(${deg}deg)`;
    val.textContent = format ? format(v) : v.toFixed(2);
  }
  draw();

  let dragging=false, startY=0, startV=0;
  const range = max-min;
  function pointerDown(e){
    dragging=true; startY = (e.touches?e.touches[0].clientY:e.clientY); startV=v;
    e.preventDefault();
  }
  function pointerMove(e){
    if(!dragging) return;
    const y = (e.touches?e.touches[0].clientY:e.clientY);
    const dy = startY - y;
    v = Math.min(max, Math.max(min, startV + (dy/140)*range));
    draw(); onChange(v);
  }
  function pointerUp(){ dragging=false; }
  knob.addEventListener('mousedown', pointerDown);
  knob.addEventListener('touchstart', pointerDown, {passive:false});
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('mouseup', pointerUp);
  window.addEventListener('touchend', pointerUp);
  knob.addEventListener('dblclick', ()=>{ v=value; draw(); onChange(v); });

  return { el:block, set:(nv)=>{ v=nv; draw(); }, get:()=>v };
}

  const wrap = document.createElement('div'); wrap.className='timeline-module';

  const header = document.createElement('div'); header.className='timeline-header';
  const title = document.createElement('div'); title.className='timeline-title'; title.textContent='TIMELINE';
  const timeDisplay = document.createElement('div'); timeDisplay.className='time-display'; timeDisplay.textContent='00:00.0 / 00:00.0';
  header.appendChild(title); header.appendChild(timeDisplay);
  wrap.appendChild(header);

  const track = document.createElement('div'); track.className='timeline-track';
  const loopRegion = document.createElement('div'); loopRegion.className='loop-region';
  const playhead = document.createElement('div'); playhead.className='playhead';
  const handleL = document.createElement('div'); handleL.className='loop-handle left'; handleL.textContent='◀';
  const handleR = document.createElement('div'); handleR.className='loop-handle right'; handleR.textContent='▶';
  track.appendChild(loopRegion); track.appendChild(playhead); track.appendChild(handleL); track.appendChild(handleR);
  wrap.appendChild(track);

  const hint = document.createElement('div'); hint.className='timeline-hint';
  hint.textContent = 'Klik op de tijdlijn om te springen — sleep de rode handles om een loop-sectie te selecteren — LOOP-knop bij MASTER BUS schakelt herhalen aan/uit.';
  wrap.appendChild(hint);

  consolePanel.appendChild(wrap);

  timelineEls = { track, playhead, loopRegion, handleL, handleR, timeDisplay };

  function fractionFromEvent(e){
    const rect = track.getBoundingClientRect();
    const x = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
    return Math.min(1, Math.max(0, x/rect.width));
  }

  track.addEventListener('click', (e)=>{
    if(e.target===handleL || e.target===handleR) return;
    if(totalDuration<=0) return;
    seekTo(fractionFromEvent(e)*totalDuration);
  });

  let dragTarget = null;
  function beginDrag(target){ return (e)=>{ dragTarget=target; e.preventDefault(); e.stopPropagation(); }; }
  handleL.addEventListener('mousedown', beginDrag('L'));
  handleL.addEventListener('touchstart', beginDrag('L'), {passive:false});
  handleR.addEventListener('mousedown', beginDrag('R'));
  handleR.addEventListener('touchstart', beginDrag('R'), {passive:false});

  window.addEventListener('mousemove', (e)=>{
    if(!dragTarget || totalDuration<=0) return;
    const t = fractionFromEvent(e)*totalDuration;
    if(dragTarget==='L') loopStart = Math.min(t, loopEnd-0.05);
    else loopEnd = Math.max(t, loopStart+0.05);
    loopStart = Math.max(0, loopStart);
    loopEnd = Math.min(totalDuration, loopEnd);
    renderTimelineVisuals();
  });
  window.addEventListener('touchmove', (e)=>{
    if(!dragTarget || totalDuration<=0) return;
    const t = fractionFromEvent(e)*totalDuration;
    if(dragTarget==='L') loopStart = Math.min(t, loopEnd-0.05);
    else loopEnd = Math.max(t, loopStart+0.05);
    loopStart = Math.max(0, loopStart);
    loopEnd = Math.min(totalDuration, loopEnd);
    renderTimelineVisuals();
  }, {passive:false});
  window.addEventListener('mouseup', ()=> dragTarget=null);
  window.addEventListener('touchend', ()=> dragTarget=null);

  renderTimelineVisuals();
  requestAnimationFrame(timelineTick);
}
buildTimeline();

/* ============================================================
   OFFLINE MIXDOWN
   ============================================================ */
async function renderMixdown(){
  const loaded = tracks.filter(t=>t.buffer);
  if(loaded.length===0){ setStatus('Niets om te renderen — laad eerst wav-bestanden.'); return; }

  setStatus('Bezig met renderen...');
  const sampleRate = ctx.sampleRate;
  const loopOnlyCheck = document.getElementById('renderLoopOnly');
  const useLoopRange = loopOnlyCheck && loopOnlyCheck.checked && (loopEnd - loopStart) > 0.05;
  const rangeStart = useLoopRange ? loopStart : 0;
  const rangeEnd = useLoopRange ? loopEnd : Math.max(...loaded.map(t=>t.buffer.duration));
  const rangeLength = Math.max(0.05, rangeEnd - rangeStart);
  const tail = reverbParams.decay + 1.0;
  const totalLength = Math.ceil((rangeLength + tail) * sampleRate);

  const offlineCtx = new OfflineAudioContext(2, totalLength, sampleRate);

  const oMasterInput = offlineCtx.createGain();
  const oMasterFader = offlineCtx.createGain();
  oMasterFader.gain.value = masterGainValue;
  oMasterInput.connect(oMasterFader);
  oMasterFader.connect(offlineCtx.destination);

  const oReverbInput = offlineCtx.createGain();
  const oConvolver = offlineCtx.createConvolver();
  oConvolver.buffer = convolver.buffer; // reuse currently generated impulse (matches current decay/size)
  const oLocut = offlineCtx.createBiquadFilter(); oLocut.type='highpass'; oLocut.frequency.value = reverbParams.locut;
  const oHicut = offlineCtx.createBiquadFilter(); oHicut.type='lowpass'; oHicut.frequency.value = reverbParams.hicut;
  const oReverbReturn = offlineCtx.createGain();
  oReverbReturn.gain.value = reverbReturnGainValue;

  oReverbInput.connect(oConvolver);
  oConvolver.connect(oLocut);
  oLocut.connect(oHicut);
  oHicut.connect(oReverbReturn);
  oReverbReturn.connect(oMasterInput);

  const anySolo = tracks.some(t=>t.solo);

  loaded.forEach(t=>{
    if(rangeStart >= t.buffer.duration - 0.001) return; // this track has nothing in the selected range
    const audible = anySolo ? t.solo : !t.muted;
    const src = offlineCtx.createBufferSource();
    src.buffer = t.buffer;
    const bufOffset = Math.min(rangeStart, t.buffer.duration);
    const bufDur = Math.max(0, Math.min(rangeEnd, t.buffer.duration) - bufOffset);
    if(bufDur <= 0) return;

    const oLowCut = offlineCtx.createBiquadFilter(); oLowCut.type='highpass';
    oLowCut.frequency.value = t.lowCutOn ? LOCUT_FREQ : 20;
    const oLowShelf = offlineCtx.createBiquadFilter(); oLowShelf.type='lowshelf';
    oLowShelf.frequency.value = LOW_SHELF_FREQ; oLowShelf.gain.value = t.lowGain;
    const oMid = offlineCtx.createBiquadFilter(); oMid.type='peaking';
    oMid.frequency.value = t.midFreq; oMid.Q.value = 1; oMid.gain.value = t.midGain;
    const oHighShelf = offlineCtx.createBiquadFilter(); oHighShelf.type='highshelf';
    oHighShelf.frequency.value = HIGH_SHELF_FREQ; oHighShelf.gain.value = t.highGain;

    const gain = offlineCtx.createGain(); gain.gain.value = t.volume;
    const pan = offlineCtx.createStereoPanner ? offlineCtx.createStereoPanner() : null;
    if(pan) pan.pan.value = t.pan;
    const muteGain = offlineCtx.createGain(); muteGain.gain.value = audible ? 1 : 0;
    const send = offlineCtx.createGain(); send.gain.value = t.send;

    src.connect(oLowCut);
    oLowCut.connect(oLowShelf);
    oLowShelf.connect(oMid);
    oMid.connect(oHighShelf);
    oHighShelf.connect(gain);
    (pan? gain.connect(pan) : null);
    (pan? pan.connect(muteGain) : gain.connect(muteGain));
    muteGain.connect(oMasterInput);
    muteGain.connect(send);
    send.connect(oReverbInput);

    src.start(0, bufOffset, bufDur);
  });

  try{
    const rendered = await offlineCtx.startRendering();
    const wavBlob = audioBufferToWavBlob(rendered);
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mixdown_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.wav';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    setStatus('Mixdown opgeslagen als WAV-bestand.');
  }catch(err){
    console.error(err);
    setStatus('Render mislukt: ' + err.message);
  }
}

function audioBufferToWavBlob(buffer){
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const format = 1; // PCM
  const bitDepth = 16;

  let interleaved;
  if(numChannels === 2){
    interleaved = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
  } else {
    interleaved = buffer.getChannelData(0);
  }

  const dataLength = interleaved.length * (bitDepth/8);
  const bufferArr = new ArrayBuffer(44 + dataLength);
  const view = new DataView(bufferArr);

  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + dataLength, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, format, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * (bitDepth/8), true);
  view.setUint16(32, numChannels * (bitDepth/8), true);
  view.setUint16(34, bitDepth, true);
  writeString(view, 36, 'data');
  view.setUint32(40, dataLength, true);

  floatTo16BitPCM(view, 44, interleaved);
  return new Blob([view], {type:'audio/wav'});
}
function interleave(l,r){
  const length = l.length + r.length;
  const result = new Float32Array(length);
  let index=0, inputIndex=0;
  while(index<length){
    result[index++] = l[inputIndex];
    result[index++] = r[inputIndex];
    inputIndex++;
  }
  return result;
}
function writeString(view, offset, str){
  for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i));
}
function floatTo16BitPCM(view, offset, input){
  for(let i=0;i<input.length;i++, offset+=2){
    let s = Math.max(-1, Math.min(1, input[i]));
    s = s<0 ? s*0x8000 : s*0x7FFF;
    view.setInt16(offset, s, true);
  }
}
